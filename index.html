<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트림스 보드게임</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 로비 -->
    <div id="lobby" class="lobby">
        <header>
            <h1>🎲 스트림스 (Streams)</h1>
            <p class="subtitle">온라인 멀티플레이어 보드게임</p>
        </header>

        <div class="lobby-content">
            <div class="setup-section">
                <h2>게임 시작하기</h2>
                <input type="text" id="playerNameInput" placeholder="플레이어 이름 입력" maxlength="15">

                <div class="button-group">
                    <button id="soloPlayBtn" class="btn btn-primary">혼자 하기</button>
                    <button id="createRoomBtn" class="btn btn-primary">방 만들기</button>
                    <button id="joinRoomBtn" class="btn btn-secondary">방 참가하기</button>
                </div>

                <div id="joinRoomForm" style="display: none;">
                    <input type="text" id="roomCodeInput" placeholder="방 코드 입력" maxlength="6">
                    <button id="joinRoomConfirmBtn" class="btn btn-primary">참가</button>
                    <button id="joinRoomCancelBtn" class="btn btn-secondary">취소</button>
                </div>
            </div>

            <div id="roomSection" style="display: none;">
                <h2>방 코드: <span id="roomCodeDisplay"></span></h2>
                <p class="room-hint">친구들에게 이 코드를 알려주세요!</p>

                <div class="players-list">
                    <h3>참가자 목록</h3>
                    <div id="playersListContent"></div>
                </div>

                <button id="startGameBtn" class="btn btn-primary" style="display: none;">게임 시작</button>
                <button id="leaveLobbyBtn" class="btn btn-cancel">나가기</button>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameScreen" class="container" style="display: none;">
        <header>
            <h1>🎲 스트림스 (Streams)</h1>
            <p class="subtitle">방 코드: <span id="gameRoomCode"></span></p>
        </header>

        <div class="game-info">
            <div class="info-card">
                <label>현재 타일:</label>
                <div id="currentTile" class="current-tile">-</div>
            </div>
            <div class="info-card">
                <label>남은 타일:</label>
                <div id="remainingTiles" class="stat">20</div>
            </div>
        </div>

        <div id="playersContainer">
            <!-- 플레이어들의 시트지가 여기에 동적으로 생성됩니다 -->
        </div>

        <div class="controls">
            <button id="drawTileBtn" class="btn btn-primary">타일 뽑기</button>
        </div>

        <div class="rules">
            <h3>게임 규칙</h3>
            <ul>
                <li>타일을 뽑으면 나온 숫자를 20칸 중 원하는 곳에 배치합니다</li>
                <li>왼쪽에서 오른쪽으로 읽을 때 <strong>오름차순</strong>이어야 합니다</li>
                <li>⭐ 조커 타일은 와일드카드로, 항상 오름차순을 유지합니다</li>
                <li>각 스트림의 길이에 따라 점수가 계산됩니다 (점수 = n × (n + 1) / 2)</li>
            </ul>
        </div>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>🎉 게임 종료!</h2>
            <div id="finalScore" class="final-score"></div>
            <div id="streamBreakdown"></div>
            <button id="playAgainBtn" class="btn btn-primary">다시 하기</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
